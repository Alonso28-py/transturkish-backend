spring.application.name=transturkish-backend


# Base de datos H2 guardada en un archivo
spring.datasource.url=jdbc:h2:file:./transturkishdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mantener las tablas y sus datos al reiniciar
spring.jpa.hibernate.ddl-auto=update
